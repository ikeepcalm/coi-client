import javax.imageio.ImageIO
import java.awt.image.BufferedImage

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven { url = 'https://jitpack.io' } // discord-game-sdk4j
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "coi-client" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    if (project.hasProperty('archivePreview') || project.hasProperty('portraitPreview')) {
        runs.client {
            runDir 'build/archive-preview'
            programArgs '--width', '1440', '--height', '900', '--quickPlaySingleplayer', 'Preview'
            vmArg '-Dcoi.archivePreview=true'
            if (project.hasProperty('portraitPreview')) vmArg '-Dcoi.portraitPreview=true'
        }
    }

}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Discord Rich Presence: pure-Java Game SDK implementation over Discord's
    // local IPC socket (v1.0.0+ needs no natives). Its only runtime dependency
    // is Gson, which Minecraft already provides. Bundled jar-in-jar.
    implementation 'com.github.JnCrMx:discord-game-sdk4j:v1.0.0'
    include 'com.github.JnCrMx:discord-game-sdk4j:v1.0.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

// The protocol model lives in the client source set, but can be tested without a game window.
sourceSets.test.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

tasks.register("generateWhiteTexture") {
    doLast {
        def dir = file("src/client/resources/assets/coi-client/textures/entity")
        dir.mkdirs()
        def img = new BufferedImage(1, 1, BufferedImage.TYPE_INT_ARGB)
        img.setRGB(0, 0, -1) // white
        ImageIO.write(img, "png", new File(dir, "white.png"))
        println("Generated white.png successfully!")
    }
}

tasks.named("compileClientJava").configure {
    dependsOn("generateWhiteTexture")
}






